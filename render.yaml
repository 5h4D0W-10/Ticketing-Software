databases:
  - name: frontdesk-db
    databaseName: frontdesk
    user: frontdesk_user
    plan: free

services:
  - type: web
    name: frontdesk-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true

